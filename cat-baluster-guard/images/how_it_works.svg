<text x="760.0" y="690.0" font-size="22" text-anchor="start" font-weight="bold" fill="#333">3. What happens when a cat pushes</text>
<rect x="760" y="730" width="600" height="320" fill="#fff" stroke="#ddd" rx="8"/>
<circle cx="786" cy="765" r="7" fill="#2a8a3e"/>
<text x="804.0" y="770.0" font-size="16" text-anchor="start" font-weight="bold" fill="#333">Pushing outward (toward the drop): solid</text>
<text x="804.0" y="792.0" font-size="14.5" text-anchor="start" font-weight="normal" fill="#444">The dowel presses on the back wall of the clip, and the back wall</text>
<text x="804.0" y="812.0" font-size="14.5" text-anchor="start" font-weight="normal" fill="#444">presses on the back of the balusters. Plastic on wood, no snap</text>
<text x="804.0" y="832.0" font-size="14.5" text-anchor="start" font-weight="normal" fill="#444">involved. Same as how the balusters already hold a cat in.</text>
<circle cx="786" cy="865" r="7" fill="#7a3db8"/>
<text x="804.0" y="870.0" font-size="16" text-anchor="start" font-weight="bold" fill="#333">Pulling inward (toward the loft): zip tie</text>
<text x="804.0" y="892.0" font-size="14.5" text-anchor="start" font-weight="normal" fill="#444">A zip tie wraps each baluster and the clip, closing the open side.</text>
<text x="804.0" y="912.0" font-size="14.5" text-anchor="start" font-weight="normal" fill="#444">Ribs on the clip keep it in place. Snip to remove.</text>
<circle cx="786" cy="950" r="7" fill="#4a9be0"/>
<text x="804.0" y="955.0" font-size="16" text-anchor="start" font-weight="bold" fill="#333">Up and down</text>
<text x="804.0" y="977.0" font-size="14.5" text-anchor="start" font-weight="normal" fill="#444">Dowels stand on the bottom rail, so they can't drop. The zip ties</text>
<text x="804.0" y="997.0" font-size="14.5" text-anchor="start" font-weight="normal" fill="#444">also clamp the clips so the top ones can't slide down.</text>
